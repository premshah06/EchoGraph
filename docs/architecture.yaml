# Source of truth for the architecture diagram.
# Edit this file when the system's components or data flow change.
# The `update-architecture-diagram` skill renders docs/architecture/diagram.html from this file.
#
# If this file is absent or a section/component isn't described here, the skill
# falls back to inferring structure from the codebase (backend/agents/*, main.py, etc.)
# for anything missing — but keeping this file current is cheaper and more accurate.

title: EchoSystem Architecture

groups:
  - name: Agents
    nodes:
      - id: librarian
        label: Librarian
      - id: scholar
        label: Scholar
      - id: philosopher
        label: Philosopher
      - id: critic
        label: Critic
      - id: synthesizer
        label: Synthesizer

  - name: Graphs
    nodes:
      - id: ingestion_graph
        label: Ingestion Graph
      - id: query_graph
        label: Query Graph

  - name: Core
    nodes:
      - id: main
        label: FastAPI App (main.py)
      - id: retry
        label: Retry Logic
      - id: models
        label: Models

  - name: Data & Events
    nodes:
      - id: knowledge_store
        label: Knowledge Store
      - id: llm_client
        label: LLM Client (streaming)
      - id: events
        label: Events
      - id: state
        label: State (EchoState)

  - name: Optimization
    nodes:
      - id: engine
        label: Optimized LLM Client (streaming)
      - id: metrics
        label: Metrics
      - id: middleware
        label: Middleware
      - id: configs
        label: Configs (GraphMediator / Builder)

  - name: Eval Harness
    nodes:
      - id: fixtures
        label: Fixtures (golden JSON)
      - id: runner
        label: Runner
      - id: scorer
        label: Scorer

edges:
  - from: librarian
    to: main
  - from: scholar
    to: main
  - from: philosopher
    to: main
  - from: critic
    to: main
  - from: synthesizer
    to: main
  - from: main
    to: retry
  - from: main
    to: models
  - from: librarian
    to: ingestion_graph
  - from: critic
    to: ingestion_graph
  - from: philosopher
    to: ingestion_graph
  - from: synthesizer
    to: ingestion_graph
  - from: scholar
    to: query_graph
  - from: ingestion_graph
    to: main
  - from: query_graph
    to: main
  - from: ingestion_graph
    to: knowledge_store
  - from: query_graph
    to: knowledge_store
  - from: ingestion_graph
    to: state
  - from: query_graph
    to: state
  - from: ingestion_graph
    to: llm_client
  - from: main
    to: knowledge_store
  - from: main
    to: llm_client
  - from: main
    to: events
  - from: llm_client
    to: engine
  - from: engine
    to: metrics
  - from: engine
    to: middleware
  - from: engine
    to: configs
  - from: runner
    to: ingestion_graph
  - from: runner
    to: query_graph
  - from: runner
    to: knowledge_store
  - from: fixtures
    to: runner
  - from: runner
    to: scorer
  # All agents call emit_event directly (not just through main.py); Scholar
  # additionally emits agent_token events for live query-answer streaming.
  - from: scholar
    to: events
  - from: librarian
    to: events
  - from: philosopher
    to: events
  - from: critic
    to: events
  - from: synthesizer
    to: events
