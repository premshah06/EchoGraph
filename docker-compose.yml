services:
  echosystem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echosystem-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMADB_PERSIST_DIR=/app/data/chroma
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - chroma_data:/app/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  chroma_data:
    driver: local
