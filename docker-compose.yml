services:
  echosystem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echosystem-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMADB_PERSIST_DIR=/app/data/chroma
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - chroma_data:/app/data/chroma
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
